services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: iasi_quest_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iasi_quest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api_server:
    build:
      context: ./bot/actions
      dockerfile: Dockerfile.api
    environment:
      DB_HOST: db
      DB_NAME: iasi_quest_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5056
      SECRET_KEY: your-secret-key-change-in-production
    volumes:
      - ./bot/actions:/app/actions
      # Seed path in db.py: parent of actions/ + verified_links.json (see _seed_activities_from_json)
      - ./bot/verified_links.json:/app/verified_links.json:ro
    ports:
      - "5056:5056"
    depends_on:
      db:
        condition: service_healthy

  assistant_server:
    build:
      context: ./bot
      dockerfile: Dockerfile.azure
    environment:
      DB_HOST: db
      DB_NAME: iasi_quest_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      AZURE_PROJECT_ENDPOINT: ${AZURE_PROJECT_ENDPOINT}
      AZURE_AGENT_NAME: ${AZURE_AGENT_NAME}
      AZURE_AGENT_VERSION: ${AZURE_AGENT_VERSION}
      AZURE_ASSISTANT_ID: ${AZURE_ASSISTANT_ID}
      AZURE_API_KEY: ${AZURE_API_KEY}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-2025-11-15-preview}
      AZURE_DEPLOYMENT_NAME: ${AZURE_DEPLOYMENT_NAME:-gpt-4o}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
    volumes:
      - ./bot:/app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
